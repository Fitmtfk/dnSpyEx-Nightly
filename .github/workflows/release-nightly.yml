name: Weekly dnSpyEx Nightly Build

on:
  schedule:
    - cron: '0 0 * * 0' # 每周日凌晨运行
  workflow_dispatch:    # 支持手动触发测试

jobs:
  build-dnspy:
    name: Build dnSpyEx
    runs-on: windows-latest
    strategy:
      matrix:
        # 这里只保留你最常用的两个版本，减轻构建负担
        platform: [net-x86, net-x64]
        include:
          - platform: net-x86
            package-name: net-win32
            build-dir: net10.0-windows\win-x86\publish
          - platform: net-x64
            package-name: net-win64
            build-dir: net10.0-windows\win-x64\publish

    defaults:
      run:
        shell: pwsh

    steps:
      # 1. 准备环境

      - name: Checkout dnSpyEx Source
        uses: actions/checkout@v4
        with:
          repository: dnSpyEx/dnSpy
          path: source
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 2. 编译并打包
      - name: Build (${{ matrix.platform }})
        run: |
          cd source
          .\build.ps1 ${{ matrix.platform }}

      - name: Prepare Artifact
        id: package
        run: |
          $src = "source\dnSpy\dnSpy\bin\Release\${{ matrix.build-dir }}"
          $zipName = "dnSpyEx-${{ matrix.platform }}.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zipName
          $hash = (Get-FileHash $zipName).Hash
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          echo "hash=$hash" >> $env:GITHUB_OUTPUT
          
  build-mcp:
    name: Build MCP Server
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout MCP Source
        uses: actions/checkout@v4
        with:
          repository: soufianetahiri/dnspy-mcp
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish src/DnSpyMcpServer/DnSpyMcpServer.csproj -c Release -p:PublishProfile=win-x64 -o ./mcp-out
      - name: Package
        run: |
          Compress-Archive -Path "./mcp-out/*" -DestinationPath "dnSpy-MCP-win-x64.zip"
      - name: Upload Temp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnSpy-MCP
          path: dnSpy-MCP-win-x64.zip
          
  publish-release:
    name: Create Unified Release
    needs: [build-dnspy, build-mcp]
    runs-on: ubuntu-latest
    steps:
      - name: Get Version Info
        id: info
        shell: pwsh
        run: |
          $v = Get-Date -Format "yyyy.MM.dd"
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts 

      - name: Prepare Files for Release
        shell: bash
        run: |
          # 创建一个纯净的文件夹用来放所有要发布的 zip
          mkdir ./release-assets
          # 关键：递归查找所有子目录下的 zip 文件并拷贝到一个文件夹
          find ./artifacts -name "*.zip" -exec cp {} ./release-assets/ \;
          ls -R ./release-assets # 打印一下确认文件都在

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.version }}
          name: "dnSpyEx Nightly Toolbox ${{ steps.info.outputs.version }}"
          # 指向刚才准备好的文件夹
          files: "release-assets/*.zip" 
          body: |
            ## .NET Reverse Engineering Toolbox
            - **dnSpyEx**: Latest build from master (net-x64/x86)
            - **dnSpy-MCP-Server**: For AI-assisted reverse engineering
